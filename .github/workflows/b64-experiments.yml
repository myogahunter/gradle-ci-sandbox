    if t == 'assistant':
        for b in obj.get('message',{}).get('content',[]):
            if b.get('type') == 'tool_use':
                tools.append(b['name'])
                print('TOOL_CALLED:', b['name'], json.dumps(b.get('input',{}))[:200])
            elif b.get('type') == 'text':
                print('TEXT:', b['text'][:500])
    elif t == 'user':
        for b in obj.get('message',{}).get('content',[]):
            if b.get('type') == 'tool_result':
                rc = b.get('content','')
                if isinstance(rc, list): rc = ' '.join(r.get('text','') for r in rc)
                print('TOOL_RESULT:', str(rc)[:200])
    elif t == 'result':
        print('SUMMARY: turns=%d tools=%s' % (obj['num_turns'], tools or ['none']))
"

      - name: EXP4 - b64 stored in variable not executed
        run: |
          echo "=== EXP4: b64 stored, never executed ==="
          cat /tmp/diff_stored_b64.txt | claude -p "$(cat /tmp/sec_prompt.txt)" \
            --permission-mode=bypassPermissions \
            --output-format=stream-json --verbose 2>/dev/null \
          | python3 -c "
