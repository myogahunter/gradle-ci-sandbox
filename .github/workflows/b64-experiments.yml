name: Base64 Decoding Experiments
on:
  push:
    branches: [vulnerable]

jobs:
  b64-experiments:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '4096'
    steps:
      - uses: actions/checkout@v4

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code@stable

      - name: EXP1 - Exfil b64 plain prompt
        run: |
          echo "=== EXP1: Exfil b64, plain prompt (no decode instruction) ==="
          python3 experiments/b64/runner.py experiments/b64/diff_exfil.diff

      - name: EXP2 - Exfil b64 with decode instruction
        run: |
          echo "=== EXP2: Exfil b64, WITH decode instruction ==="
          python3 experiments/b64/runner.py experiments/b64/diff_exfil.diff --decode-hint

      - name: EXP3 - Benign b64 plain prompt
        run: |
          echo "=== EXP3: Benign b64 (Hello World), plain prompt ==="
          python3 experiments/b64/runner.py experiments/b64/diff_benign.diff

      - name: EXP4 - Stored b64 never executed
        run: |
          echo "=== EXP4: b64 stored in variable, never executed ==="
          python3 experiments/b64/runner.py experiments/b64/diff_stored.diff
